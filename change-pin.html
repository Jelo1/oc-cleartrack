<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change PIN – ClearTrack</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="content">
    <div class="page">
      <div class="page-head">
        <div>
          <p class="kicker">Account security</p>
          <h1>Change PIN</h1>
          <p class="sub">Update your existing 4-digit ClearTrack PIN.</p>
        </div>
      </div>

      <div class="two-col">
        <section class="card card-pad">
          <form id="form" novalidate>
            <div class="field">
              <label for="cur">Enter current PIN</label>
              <div class="pin-wrap"><input class="input" id="cur" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="current-password"><button type="button">Show</button></div>
            </div>
            <div class="field">
              <label for="pin">New 4-digit PIN</label>
              <div class="pin-wrap"><input class="input" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password"><button type="button">Show</button></div>
            </div>
            <div class="field">
              <label for="pin2">Confirm new PIN</label>
              <div class="pin-wrap"><input class="input" id="pin2" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="new-password"><button type="button">Show</button></div>
            </div>
            <p class="form-error" id="err" role="alert" tabindex="-1" hidden></p>
            <button class="btn btn-primary" type="submit">Update PIN</button>
          </form>
        </section>

        <div>
          <section class="card side-card tip">
            <span class="oicon" id="ic-lock"></span>
            <div><strong>Keep your PIN private</strong><p>Never share your PIN. College staff will never ask you for it.</p></div>
          </section>
          <section class="card side-card">
            <h3>Your account</h3>
            <p><strong id="aname"></strong></p>
            <p class="sub" id="aemail" style="font-size:13.5px;word-break:break-all"></p>
            <p class="sub" id="aid" style="font-size:13.5px"></p>
          </section>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data.firebase.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const user = await UI.require('student'); if (!user) return;
  await UI.mountShell(user, 'profile');
  UI.pinToggle();

  $('#ic-lock').innerHTML = UI.icon('lock', 20);
  $('#aname').textContent = user.name;
  $('#aemail').textContent = user.email;
  $('#aid').textContent = user.studentId || '';

  const err = $('#err');
  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const cur = $('#cur').value, pin = $('#pin').value, pin2 = $('#pin2').value;
    const problem = !/^\d{4}$/.test(cur) ? 'Enter your current 4-digit PIN.'
                  : !/^\d{4}$/.test(pin) ? 'New PIN must be exactly 4 digits.'
                  : pin !== pin2 ? 'PINs do not match.' : '';
    if (problem) return UI.showError(err, problem);
    const r = await DB.changePin(user.email, cur, pin);
    if (!r.ok) return UI.showError(err, r.error);
    UI.flash('PIN changed successfully.');
    location.href = 'profile.html';
  });
})();
</script>
</body>
</html>
