<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications – ClearTrack</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="layout">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar"></aside>

  <main class="content">
    <div class="page narrow" style="max-width:860px">
      <div class="page-head">
        <div>
          <p class="kicker">Student updates</p>
          <h1>Notifications</h1>
          <p class="sub">Office updates, alerts and reminders for your clearance.</p>
        </div>
      </div>
      <section class="card nlist" id="list" aria-live="polite"></section>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/data.firebase.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const user = await UI.require('student'); if (!user) return;
  await UI.mountShell(user, 'notifications');

  const items = await DB.getNotifications(user.email);
  const list = $('#list');

  if (!items.length) { list.innerHTML = '<p class="empty">No notifications yet.</p>'; return; }

  list.innerHTML = items.map(n => `
    <div class="nitem ${n.read ? '' : 'unread'}">
      <span class="nicon">${UI.icon(n.title.startsWith('Clearance deadline') ? 'alert' : n.read ? 'check' : 'bell', 20)}</span>
      <div>
        <strong>${esc(n.title)}</strong>
        <p>${esc(n.text)}</p>
        <small>${UI.fmtDate(n.date)} • ${n.read ? 'Read' : 'Unread'}</small>
      </div>
      <a class="link-btn when" href="office-info.html?o=${esc(n.office)}&from=notifications" data-id="${esc(n.id)}">View Details ${UI.icon('arrow', 14)}</a>
    </div>`).join('');

  /* Opening a notification marks it as read */
  list.addEventListener('click', async e => {
    const a = e.target.closest('a[data-id]'); if (!a) return;
    e.preventDefault();
    await DB.markRead(user.email, a.dataset.id);
    location.href = a.getAttribute('href');
  });
})();
</script>
</body>
</html>
